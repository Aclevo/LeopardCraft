name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (for example v0.1.1)"
        required: true
        type: string

# This workflow signs releases, so every action is pinned to a full commit SHA
# instead of a movable major tag. The trailing comment records which release
# the SHA came from; bump both together.

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: &matrix
        include:
          - os: ubuntu-latest
            slug: linux-x86_64
            bin: leopardcraft
            ext: tar.gz
          - os: macos-latest
            slug: macos-aarch64
            bin: leopardcraft
            ext: tar.gz
          - os: macos-15-intel
            slug: macos-x86_64
            bin: leopardcraft
            ext: tar.gz
          - os: windows-latest
            slug: windows-x86_64
            bin: leopardcraft.exe
            ext: zip
    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "building $tag for ${{ matrix.slug }}"

      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Window and GPU development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev libxrandr-dev \
            libxi-dev libxcursor-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.slug }}

      - name: Build release binary
        run: cargo build --release --locked -p leopardcraft

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          "./target/release/${{ matrix.bin }}" --version
          "./target/release/${{ matrix.bin }}" --headless selftest

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.slug }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: package ${{ matrix.slug }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: *matrix
    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      # Deliberately not checked out at the release tag: the packaging script,
      # desktop entry and icon come from the branch the workflow runs on, so an
      # older tag can be repackaged with the current formats.
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binary-${{ matrix.slug }}
          path: bin

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg rpm squashfs-tools file

      - name: Build platform downloads
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          slug="${{ matrix.slug }}"
          bin="bin/${{ matrix.bin }}"
          name="leopardcraft-${version}-${slug}"
          chmod +x "$bin"
          mkdir -p dist "stage/${name}"
          cp "$bin" "stage/${name}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "stage/${name}/"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a -tzip "dist/${name}.zip" "stage/${name}" > /dev/null
          else
            tar -czf "dist/${name}.tar.gz" -C stage "${name}"
          fi
          if [ "${slug}" = "linux-x86_64" ]; then
            bash packaging/linux/package.sh "${version}" "$bin" dist
          fi
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assets-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attach assets to the release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless Sigstore signing: the workflow exchanges this token for a
      # short-lived signing certificate tied to this repository and ref.
      id-token: write
    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: assets-*
          path: assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      # Installer pinned by SHA, cosign itself pinned to the release that
      # produced the v0.1.0 bundle format this job signs and verifies.
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: "v2.5.2"

      - name: Sign SHA256SUMS (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle assets/SHA256SUMS.sigstore.json \
            assets/SHA256SUMS

      - name: Verify the signature we just made
        shell: bash
        env:
          IDENTITY: '^https://github\.com/Aclevo/LeopardCraft/\.github/workflows/release\.yml@refs/(heads|tags)/.+$'
        run: |
          set -euo pipefail
          cosign verify-blob assets/SHA256SUMS \
            --bundle assets/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          # Show who the certificate was issued to. Cosmetic only: the check
          # above is what has to pass, and bundle layouts vary between cosign
          # releases, so a missing field must not fail the release.
          cert=$(jq -r '.verificationMaterial.certificate.rawBytes? // .verificationMaterial.x509CertificateChain.certificates[0].rawBytes? // empty' \
            assets/SHA256SUMS.sigstore.json)
          if [ -n "${cert}" ]; then
            printf '%s' "${cert}" | base64 -d \
              | openssl x509 -inform der -noout -subject | tee /dev/stderr
          fi

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          ls -l assets
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" \
              --title "LeopardCraft ${tag#v}" --generate-notes
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets \
            -q '"release: \(.url)", (.assets[] | "  \(.name)  \(.size) bytes")'
