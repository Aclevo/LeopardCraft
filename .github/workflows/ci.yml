name: CI

on:
  push:
  pull_request:

# Actions are pinned to full commit SHAs for the same reason as release.yml, so
# a moved major tag cannot change what CI runs. The trailing comment records the
# release the SHA came from; Dependabot (.github/dependabot.yml) updates the SHA
# and the comment together each week, so bump both if you edit by hand.

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Window and GPU development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev libxrandr-dev \
            libxi-dev libxcursor-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Headless selftest
        run: cargo run -p leopardcraft -- --headless selftest
