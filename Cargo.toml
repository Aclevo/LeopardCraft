[workspace]
resolver = "2"
members = [
    "crates/lc-core",
    "crates/lc-geom",
    "crates/lc-shading",
    "crates/lc-anim",
    "crates/lc-scene",
    "crates/lc-render",
    "crates/lc-io",
    "crates/lc-mcp",
    "crates/lc-ui",
    "app",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.34", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
rayon = "1"
pollster = "1"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "persistence"] }
egui = "0.36"

# Dev artifacts keep line tables only: full debug info was 93% of every test
# binary. Backtraces still get file:line; gdb variable inspection is lost.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
